<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Growtopia Player Support</title>
    <style>
      body {
        background-color: transparent;
        font-family: "Arial", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        color: #e2e8f0;
      }
      .container {
        width: 100%;
        max-width: 400px;
        background: #0f172a;
        padding: 20px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        border-radius: 12px;
        border: 1px solid #1e293b;
        box-sizing: border-box;
      }
      .header h1 {
        margin-bottom: 20px;
        text-align: center;
        color: #ffffff;
        font-size: 24px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-control {
        width: 100%;
        border-radius: 8px;
        padding: 12px;
        border: 1px solid #334155;
        background: #1f2937;
        color: #e2e8f0;
        box-sizing: border-box;
      }
      .form-control::placeholder {
        color: #9ca3af;
      }
      .btn-primary {
        display: block;
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background-color: #3b82f6;
        color: #ffffff;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s ease;
        box-sizing: border-box;
      }
      .btn-primary:hover {
        background-color: #2563eb;
      }
      .forgot-password {
        text-align: center;
        margin: 15px 0;
        background-color: #374151;
        border-radius: 8px;
        box-sizing: border-box;
      }
      .forgot-password a {
        color: #60a5fa;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .forgot-password a img {
        width: 24px;
        height: 24px;
      }
      .forgot-password a:hover {
        text-decoration: underline;
      }
      .checkbox {
        display: flex;
        align-items: center;
        margin-bottom: 15px;
      }
      .checkbox input {
        margin-right: 10px;
      }
      #create-account {
        color: #60a5fa;
        font-size: small;
        display: block;
        text-align: center;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Login to Growtopia</h1>
      </div>
      <form method="POST" action="/player/growid/login/validate" id="loginForm">
        <div class="form-group">
          <input
            id="growId"
            class="form-control"
            placeholder="Enter your GrowID"
            name="growId"
            type="text"
            required
          />
        </div>
        <div class="form-group">
          <input
            id="password"
            class="form-control"
            placeholder="Enter your password"
            name="password"
            type="password"
            required
          />
        </div>
        <div class="checkbox">
          <input type="checkbox" id="keepLoggedIn" name="keepLoggedIn" />
          <label for="keepLoggedIn">Keep me logged in</label>
        </div>
        <div class="form-group">
          <input class="btn-primary" type="submit" value="Login" />
        </div>
        <div class="form-group forgot-password">
          <a href="https://discord.gg/mJBUQA7uuX" target="_blank">
            <p>Need Help?</p>
          </a>
        </div>
        <a href="https://growtavern.site" id="create-account" target="_blank">
          Create Your Account Here
        </a>
      </form>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const keepLoggedInCheckbox = document.getElementById("keepLoggedIn");
        const growIdInput = document.getElementById("growId");
        const passwordInput = document.getElementById("password");
        const loginForm = document.getElementById("loginForm");

        const savedGrowId = localStorage.getItem("growId");
        const savedPassword = localStorage.getItem("password");
        const keepLoggedIn = localStorage.getItem("keepLoggedIn") === "true";

        if (keepLoggedIn) {
          growIdInput.value = savedGrowId || "";
          passwordInput.value = savedPassword || "";
          keepLoggedInCheckbox.checked = true;
        }

        loginForm.addEventListener("submit", function () {
          if (keepLoggedInCheckbox.checked) {
            localStorage.setItem("growId", growIdInput.value);
            localStorage.setItem("password", passwordInput.value);
            localStorage.setItem("keepLoggedIn", "true");
          } else {
            localStorage.removeItem("growId");
            localStorage.removeItem("password");
            localStorage.removeItem("keepLoggedIn");
          }
        });
      });
    </script>
  </body>
</html>
