<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Growtopia Player Support</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background-color: #121212;
        color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
      }
      .container {
        width: 100%;
        max-width: 400px;
        background-color: #1e1e1e;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      }
      .header {
        text-align: center;
        margin-bottom: 20px;
      }
      .header h1 {
        margin: 0;
        font-size: 24px;
        color: #e0e0e0;
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        color: #b0b0b0;
      }
      .form-group input {
        width: 100%;
        padding: 10px;
        border: 1px solid #333;
        border-radius: 4px;
        background-color: #2c2c2c;
        color: #ffffff;
      }
      .form-group input:focus {
        border-color: #6200ea;
        outline: none;
      }
      .form-group .checkbox {
        display: flex;
        align-items: center;
      }
      .form-group .checkbox input {
        margin-right: 10px;
      }
      .form-group button {
        width: 100%;
        padding: 10px;
        background-color: #6200ea;
        border: none;
        border-radius: 4px;
        color: #ffffff;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }
      .form-group button:hover {
        background-color: #3700b3;
      }
      .form-group .forgot-password {
        text-align: center;
        margin-top: 10px;
      }
      .form-group .forgot-password a {
        color: #bb86fc;
        text-decoration: none;
      }
      .form-group .forgot-password a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Login to Growtopia</h1>
      </div>
      <form method="POST" action="/player/growid/login/validate" id="loginForm">
        <div class="form-group">
          <label for="growId">GrowID</label>
          <input
            type="text"
            id="growId"
            name="growId"
            placeholder="Enter your GrowID"
            required
          />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
          />
        </div>
        <div class="form-group">
          <label class="checkbox">
            <input type="checkbox" id="keepLoggedIn" name="keepLoggedIn" />
            Keep me logged in
          </label>
        </div>
        <div class="form-group">
          <button type="submit">Login</button>
        </div>
        <div class="form-group forgot-password">
          <a href="#">Forgot your password?</a>
        </div>
      </form>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const keepLoggedInCheckbox = document.getElementById("keepLoggedIn");
        const loginForm = document.getElementById("loginForm");

        // Handle form submission
        loginForm.addEventListener("submit", function () {
          if (keepLoggedInCheckbox.checked) {
            localStorage.setItem("keepLoggedIn", "true");
          } else {
            localStorage.removeItem("keepLoggedIn");
          }
        });

        // Auto-login if "Keep me logged in" was previously set
        if (localStorage.getItem("keepLoggedIn") === "true") {
          // Implement auto-login logic here
          // For example, you might redirect to a dashboard or perform an auto-login request
          window.location.href = "/player/login/dashboard";
        }
      });
    </script>
  </body>
</html>
