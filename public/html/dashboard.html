<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/jwt-decode/build/jwt-decode.js"></script>
  </head>
  <body>
    <!-- dashboard -->
    <div
      id="dashboard"
      class="min-h-screen flex items-center justify-center bg-transparent"
    >
      <div
        class="w-full max-w-md p-8 space-y-8 bg-[#234b78] rounded-lg shadow-lg border border-[#2d5d96]"
      >
        <div class="flex items-center gap-3 w-max mx-auto">
          <h2 class="text-3xl font-bold text-center text-white">Welcome to</h2>
          <img
            src="https://res.cloudinary.com/dju3jontk/image/upload/q_100/v1726205113/growtavern_i0uro3.webp"
            alt="GrowTavern"
            class="w-max h-10"
          />
        </div>
        <div class="space-y-4">
          <div
            class="flex items-center justify-center gap-2 w-full bg-black hover:bg-gray-900 text-white text-center py-2 rounded-md"
          >
            <img
              src="https://res.cloudinary.com/dju3jontk/image/upload/q_100/v1728529382/link_ticn6n.webp"
              alt="Google"
              class="h-5 object-fit"
              sizes="100vw"
            />
            <a href="/player/login/dashboard"> Create Your Account </a>
          </div>
          <div class="relative">
            <div class="absolute inset-0 flex items-center">
              <span class="w-full border-t border-white"></span>
            </div>
            <div class="relative flex justify-center text-sm">
              <span class="px-2 bg-[#234b78] text-white font-bold"
                >Legacy users only</span
              >
            </div>
          </div>
          <button
            onclick="handleLoginGoogle()"
            class="w-full bg-black hover:bg-gray-900 text-white gap-2 border border-white text-center py-2 rounded-md flex items-center justify-center"
          >
            <img
              src="https://res.cloudinary.com/dju3jontk/image/upload/q_100/v1728543553/search_pzvyho.webp"
              alt="GrowTavern"
              class="h-5 object-fit"
              sizes="100vw"
            />
            Continue with Google
          </button>
          <button
            onclick="handleLoginClick()"
            class="w-full bg-black hover:bg-gray-900 text-yellow-400 border border-yellow-400 text-center py-2 rounded-md flex items-center justify-center"
          >
            <span class="mr-2 text-2xl font-bold">G</span>
            growTavern Login
          </button>
        </div>
      </div>
    </div>

    <!-- login -->
    <div
      id="login"
      class="min-h-screen flex items-center justify-center bg-transparent hidden"
    >
      <div
        class="w-full max-w-md p-8 space-y-8 bg-[#234b78] rounded-lg shadow-lg border border-[#2d5d96]"
      >
        <h2 class="text-3xl font-bold text-center text-white">
          Log in with your Grow ID
        </h2>
        <form
          method="POST"
          action="/player/growid/login/validate"
          id="loginForm"
          class="space-y-2"
        >
          <div class="space-y-2">
            <label for="growId" class="sr-only">Your GrowTavern Name</label>
            <input
              id="growId"
              name="growId"
              placeholder="Your GrowTavern Name *"
              required
              class="w-full px-3 py-2 bg-[#1e3a5f] border border-[#2d5d96] rounded-md text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#3d7dcc] focus:border-transparent"
            />
          </div>
          <div class="space-y-2">
            <label for="password" class="sr-only"
              >Your growTavern Password</label
            >
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Your growTavern Password *"
              required
              class="w-full px-3 py-2 bg-[#1e3a5f] border border-[#2d5d96] rounded-md text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#3d7dcc] focus:border-transparent"
            />
          </div>
          <div class="checkbox space-y-2">
            <input type="checkbox" id="keepLoggedIn" />
            <label for="keepLoggedIn" class="text-white"
              >Keep me logged in</label
            >
          </div>
          <div class="text-center">
            <a href="#" class="text-[#ff6b35] hover:underline"
              >Forgot Password</a
            >
          </div>
          <button
            type="submit"
            class="w-full bg-[#00a8ff] hover:bg-[#0096e0] text-white font-bold py-2 px-4 rounded-md shadow-md transition duration-300 ease-in-out transform hover:scale-105"
          >
            Log in
          </button>
        </form>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const keepLoggedInCheckbox = document.getElementById("keepLoggedIn");
        const growIdInput = document.getElementById("growId");
        const passwordInput = document.getElementById("password");
        const loginForm = document.getElementById("loginForm");

        const savedGrowId = localStorage.getItem("growId");
        const savedPassword = localStorage.getItem("password");
        const keepLoggedIn = localStorage.getItem("keepLoggedIn") === "true";

        if (keepLoggedIn) {
          growIdInput.value = savedGrowId || "";
          passwordInput.value = savedPassword || "";
          keepLoggedInCheckbox.checked = true;
        }

        loginForm.addEventListener("submit", function () {
          if (keepLoggedInCheckbox.checked) {
            localStorage.setItem("growId", growIdInput.value);
            localStorage.setItem("password", passwordInput.value);
            localStorage.setItem("keepLoggedIn", true);
          } else {
            localStorage.removeItem("growId");
            localStorage.removeItem("password");
            localStorage.removeItem("keepLoggedIn");
          }
        });
      });

      function handleLoginGoogle() {
        fetch("https://grow-login-alpha.vercel.app/player/auth/google", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.status === "success") {
              window.location.href = data.url;
            } else {
              console.error(data.message);
              alert("Failed to authenticate with Google. Please try again.");
            }
          })
          .catch((error) => {
            console.error("Error:", error);
            alert("An error occurred while trying to authenticate.");
          });
      }

      function handleLoginClick() {
        document.getElementById("dashboard").classList.add("hidden");
        document.getElementById("login").classList.remove("hidden");
      }

      //  start sneding token
      function getAccessToken() {
        const hash = window.location.hash;
        const params = new URLSearchParams(hash.substring(1));
        return params.get("access_token");
      }

      async function sendTokenToServer(token) {
        try {
          await fetch("https://grow-login-alpha.vercel.app/decode-token", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ access_token: token }),
          });
        } catch (error) {
          console.error("Error sending token to server:", error);
        }
      }

      document.addEventListener("DOMContentLoaded", async function () {
        const accessToken = getAccessToken();

        if (accessToken) {
          await sendTokenToServer(accessToken);
          console.log("Access Token telah dikirim ke server.");
        } else {
          console.log("Access Token tidak ditemukan di URL.");
        }
      });
    </script>
  </body>
</html>
