<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link
      rel="icon"
      type="image/png"
      href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/growtopia.ico"
      sizes="16x16"
    />
    <link
      rel="stylesheet"
      href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/faq-main.css"
    />
    <link
      rel="stylesheet"
      href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/shop-custom.css"
    />
    <link
      rel="stylesheet"
      href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/ingame-custom.css"
    />
    <style>
      body {
        background-color: #f4f4f4;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        max-width: 400px;
        width: 100%;
        background: #fff;
        padding: 20px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
      }
      h2 {
        margin-bottom: 20px;
        text-align: center;
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-control {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
      }
      .btn-primary {
        display: block;
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 4px;
        background-color: #007bff;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
      }
      .btn-primary:hover {
        background-color: #0056b3;
      }
      .forgot-password {
        text-align: center;
        margin: 10px 0;
      }
      .forgot-password a {
        color: #007bff;
        text-decoration: none;
      }
      .forgot-password a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Log in with your GrowID</h2>
      <form
        method="POST"
        action="/player/growid/login/validate"
        accept-charset="UTF-8"
        role="form"
        required
        autocomplete="off"
      >
        <input name="_token" type="hidden" value="" />
        <div class="form-group">
          <input
            id="login-name"
            class="form-control"
            placeholder="Your GrowID Name *"
            name="growId"
            type="text"
          />
        </div>
        <div class="form-group">
          <input
            id="password"
            class="form-control"
            placeholder="Your GrowID Password *"
            name="password"
            type="password"
            value=""
          />
        </div>
        <div class="form-group forgot-password">
          <a href="https://gg.gg/venturaps" target="_blank"
            >Need Help? Join our Discord!</a
          >
        </div>
        <div class="form-group">
          <input class="btn-primary" type="submit" value="Log in" />
        </div>
      </form>
    </div>
  </body>
</html>
