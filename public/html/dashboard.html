<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <!-- dashboard -->
    <div
      id="dashboard"
      class="min-h-screen flex items-center justify-center bg-transparent"
    >
      <div
        class="w-full max-w-md p-8 space-y-8 bg-[#234b78] rounded-lg shadow-lg border border-[#2d5d96]"
      >
        <h2 class="text-3xl font-bold text-center text-white">
          Welcome to GrowTopia
        </h2>
        <div class="space-y-4">
          <a
            href="/player/login/dashboard"
            class="block w-full bg-black hover:bg-gray-900 text-white text-center py-2 rounded-md"
          >
            Create Your Account
          </a>
          <a
            href="#"
            class="block w-full bg-[#202124] hover:bg-gray-800 text-white text-center py-2 rounded-md"
          >
            Need help
          </a>
          <div class="relative">
            <div class="absolute inset-0 flex items-center">
              <span class="w-full border-t border-gray-500"></span>
            </div>
            <div class="relative flex justify-center text-sm">
              <span class="px-2 bg-[#234b78] text-gray-400"
                >Legacy users only</span
              >
            </div>
          </div>
          <button
            onclick="handleLoginClick()"
            class="w-full bg-black hover:bg-gray-900 text-yellow-400 border-yellow-400 text-center py-2 rounded-md"
          >
            <span class="mr-2 text-2xl font-bold">G</span>
            Growtopia Login
          </button>
        </div>
      </div>
    </div>

    <!-- login -->
    <div
      id="login"
      class="min-h-screen flex items-center justify-center bg-transparent hidden"
    >
      <div
        class="w-full max-w-md p-8 space-y-8 bg-[#234b78] rounded-lg shadow-lg border border-[#2d5d96]"
      >
        <h2 class="text-3xl font-bold text-center text-white">
          Log in with your Grow ID
        </h2>
        <form
          method="POST"
          action="/player/growid/login/validate"
          id="loginForm"
          class="space-y-6"
        >
          <div class="space-y-2">
            <label for="growId" class="sr-only">Your Growtopia Name</label>
            <input
              id="growId"
              name="growId"
              placeholder="Your Growtopia Name *"
              required
              class="w-full px-3 py-2 bg-[#1e3a5f] border border-[#2d5d96] rounded-md text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#3d7dcc] focus:border-transparent"
            />
          </div>
          <div class="space-y-2">
            <label for="password" class="sr-only"
              >Your Growtopia Password</label
            >
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Your Growtopia Password *"
              required
              class="w-full px-3 py-2 bg-[#1e3a5f] border border-[#2d5d96] rounded-md text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#3d7dcc] focus:border-transparent"
            />
          </div>
          <div class="checkbox space-y-2">
            <input type="checkbox" id="keepLoggedIn" />
            <label for="keepLoggedIn" class="text-white"
              >Keep me logged in</label
            >
          </div>
          <div class="text-center">
            <a href="#" class="text-[#ff6b35] hover:underline"
              >Forgot Password</a
            >
          </div>
          <button
            type="submit"
            class="w-full bg-[#00a8ff] hover:bg-[#0096e0] text-white font-bold py-2 px-4 rounded-md shadow-md transition duration-300 ease-in-out transform hover:scale-105"
          >
            Log in
          </button>
        </form>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const keepLoggedInCheckbox = document.getElementById("keepLoggedIn");
        const growIdInput = document.getElementById("growId");
        const passwordInput = document.getElementById("password");
        const loginForm = document.getElementById("loginForm");

        const savedGrowId = localStorage.getItem("growId");
        const savedPassword = localStorage.getItem("password");
        const keepLoggedIn = localStorage.getItem("keepLoggedIn") === "true";

        if (keepLoggedIn) {
          growIdInput.value = savedGrowId || "";
          passwordInput.value = savedPassword || "";
          keepLoggedInCheckbox.checked = true;
        }

        loginForm.addEventListener("submit", function () {
          if (keepLoggedInCheckbox.checked) {
            localStorage.setItem("growId", growIdInput.value);
            localStorage.setItem("password", passwordInput.value);
            localStorage.setItem("keepLoggedIn", "true");
          } else {
            localStorage.removeItem("growId");
            localStorage.removeItem("password");
            localStorage.removeItem("keepLoggedIn");
          }
        });
      });

      function handleLoginClick() {
        // Menyembunyikan dashboard dan menampilkan login
        document.getElementById("dashboard").classList.add("hidden");
        document.getElementById("login").classList.remove("hidden");
      }
    </script>
  </body>
</html>
