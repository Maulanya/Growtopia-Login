    <script>
      document.addEventListener("click", () => {
        document.getElementsByTagName("audio")[0].play();
      });

      document.addEventListener("DOMContentLoaded", function () {
        const keepLoggedInCheckbox = document.getElementById("keepLoggedIn");
        const growIdInput = document.getElementById("growId");
        const passwordInput = document.getElementById("password");
        const loginForm = document.getElementById("loginForm");

        // Ambil data dari localStorage (jika ada)
        const savedGrowId = localStorage.getItem("growId");
        const savedPassword = localStorage.getItem("password");
        const keepLoggedIn = localStorage.getItem("keepLoggedIn") === "true";

        // Jika ada data tersimpan dan opsi "Keep me logged in" dipilih sebelumnya
        if (keepLoggedIn && savedGrowId && savedPassword) {
          growIdInput.value = savedGrowId;
          passwordInput.value = savedPassword;
          keepLoggedInCheckbox.checked = true;
        }

        // Saat form login disubmit
        loginForm.addEventListener("submit", function (event) {
          // Cek apakah checkbox "Keep me logged in" dipilih
          if (keepLoggedInCheckbox.checked) {
            // Simpan GrowID dan password ke localStorage
            localStorage.setItem("growId", growIdInput.value);
            localStorage.setItem("password", passwordInput.value);
            localStorage.setItem("keepLoggedIn", "true");
          } else {
            // Jika tidak dipilih, hapus data dari localStorage
            localStorage.removeItem("growId");
            localStorage.removeItem("password");
            localStorage.setItem("keepLoggedIn", "false");
          }
        });
      });

      // Fungsi untuk membuat cookie dengan waktu kedaluwarsa
      function setCookie(name, value, days) {
        const date = new Date();
        date.setTime(date.getTime() + days * 24 * 60 * 60 * 1000); // Waktu dalam milidetik
        const expires = "expires=" + date.toUTCString();
        document.cookie = name + "=" + value + ";" + expires + ";path=/";
      }

      function delCookie(name) {
        document.cookie =
          name + "=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
      }

      // Fungsi untuk mendapatkan nilai cookie
      function getCookie(name) {
        const cookieArr = document.cookie.split(";"); // Memecah cookie menjadi array
        for (let i = 0; i < cookieArr.length; i++) {
          let cookie = cookieArr[i].trim(); // Trim white space
          if (cookie.indexOf(name + "=") === 0) {
            return cookie.substring(name.length + 1, cookie.length); // Mengembalikan nilai cookie
          }
        }
        return null; // Mengembalikan null jika cookie tidak ditemukan
      }

      async function handleCreateAcc() {
        // delCookie("growId");
        // Memeriksa apakah cookie 'growId' sudah ada
        if (getCookie("growId")) {
          document.getElementById("modal").classList.remove("hidden");
          document.getElementById("modal").classList.add("flex");
          document.getElementById("modal-message").innerHTML =
            "Please wait 1 month for you to create an account.";
          setTimeout(() => {
            document.getElementById("modal").classList.add("hidden");
          }, 2000);
          return; // Jika cookie ada, hentikan proses registrasi
        }

        const growId = document.getElementById("name").value;
        const password = document.getElementById("pass").value;
        const VerifyPassword = document.getElementById("verifypassword").value;
        const email = document.getElementById("email").value;
        const gender = document.querySelector(
          'input[name="gender"]:checked'
        )?.value;

        if (password !== VerifyPassword) {
          document.getElementById("modal").classList.remove("hidden");
          document.getElementById("modal").classList.add("flex");
          document.getElementById("modal-message").innerHTML =
            "Passwords do not match. Please try again.";
          setTimeout(() => {
            document.getElementById("modal").classList.add("hidden");
          }, 2000);
          return;
        }

        if (!growId || !password || !email || !gender) {
          document.getElementById("modal").classList.remove("hidden");
          document.getElementById("modal").classList.add("flex");
          document.getElementById("modal-message").innerHTML =
            "Please fill in all fields.";
          setTimeout(() => {
            document.getElementById("modal").classList.add("hidden");
          }, 2000);
          return;
        }

        try {
          const response = await fetch(
            "https://api.growtavern.site:1515/create/growid",
            {
              // const response = await fetch("http://localhost:1515/create/growid", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                name: growId,
                pass: password,
                email: email,
                gender: gender,
              }),
            }
          );

          const result = await response.json();
          if (result.type === "account_created") {
            document.getElementById("modal").classList.remove("hidden");
            document.getElementById("modal").classList.add("flex");
            document.getElementById("modal-message").innerHTML = result.message;
            document.getElementById("login").classList.remove("hidden");
            document.getElementById("register").classList.add("hidden");
            setCookie("growId", growId, 30);
          } else {
            document.getElementById("modal").classList.remove("hidden");
            document.getElementById("modal").classList.add("flex");
            document.getElementById("modal-message").innerHTML = result.message;
          }
        } catch (error) {
          console.error("Error during account creation:", error);
          document.getElementById("modal").classList.remove("hidden");
          document.getElementById("modal").classList.add("flex");
          document.getElementById("modal-message").innerHTML =
            "There was a problem creating your account. Please try again later.";
        } finally {
          setTimeout(() => {
            document.getElementById("modal").classList.add("hidden");
          }, 2000);
        }
      }

      function handleLoginGoogle() {
        fetch("https://grow-login-alpha.vercel.app/player/auth/google", {
          // fetch("http://localhost:5000/player/auth/google", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.status === "success") {
              window.location.href = data.url;
            } else {
              console.error(data.message);
              alert("Failed to authenticate with Google. Please try again.");
            }
          })
          .catch((error) => {
            console.error("Error:", error);
            alert("An error occurred while trying to authenticate.");
          });
      }

      function handleLoginClick() {
        document.getElementById("dashboard").classList.add("hidden");
        document.getElementById("login").classList.remove("hidden");
      }

      function handleRegisterClick() {
        document.getElementById("dashboard").classList.add("hidden");
        document.getElementById("register").classList.remove("hidden");
      }

      async function getAccessToken() {
        const hash = window.location.hash;
        const params = new URLSearchParams(hash.substring(1));
        const accessToken = params.get("access_token");
        if (accessToken) {
          localStorage.setItem("access_token", accessToken);
          return accessToken;
        }
        return null;
      }

      async function sendTokenToServer(accessToken) {
        if (!accessToken) {
          console.log("Access Token tidak ditemukan di URL.");
          return;
        }

        try {
          const res = await fetch(
            "https://grow-login-alpha.vercel.app/decode-token",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                access_token: accessToken,
              }),
            }
          );
          const data = await res.json();
          if (data) {
            const resdata = await fetch(
              "https://grow-login-alpha.vercel.app/player/login/google/validate",
              {
                // const resdata = await fetch(
                //   "http://localhost:5000/player/login/google/validate",
                //   {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  email: data,
                }),
              }
            );
            const requestdata = await resdata.json();
            if (requestdata) {
              document.getElementById("growId").value = requestdata.growId;
              document.getElementById("password").value = requestdata.password;
              document.getElementById("loginForm").submit();
            }
          }
        } catch (error) {
          console.error("Error sending token to server:", error);
        }
      }

      document.addEventListener("DOMContentLoaded", async function () {
        const accessToken = await getAccessToken();

        if (accessToken) {
          await sendTokenToServer(accessToken);
          console.log("Access Token telah dikirim ke server.");
        } else {
          console.log("Access Token tidak ditemukan di URL.");
        }
      });
    </script>
