<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Login</title>
    <style>
      /* Reset default styling */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      /* Container for login form */
      .container {
        max-width: 400px;
        width: 90%;
        padding: 20px;
        background-color: #1c1f27;
        border-radius: 8px;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        margin: auto;
      }

      h1 {
        color: white;
        text-align: center;
        margin-bottom: 10px;
      }

      h2 {
        text-align: center;
        margin-bottom: 20px;
        color: white;
      }

      /* Form group spacing */
      .form-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        margin-bottom: 5px;
        color: white;
      }

      /* Input styling */
      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 12px;
        font-size: 1em;
        border-radius: 4px;
        border: 1px solid #ccc;
        box-sizing: border-box;
        background-color: #f9f9f9;
      }

      /* Link styling */
      a {
        color: #007bff;
        text-decoration: none;
        font-size: 0.9em;
      }

      a:hover {
        text-decoration: underline;
      }

      /* Checkbox styling */
      .form-group-checkbox {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: white;
        margin-bottom: 20px;
      }

      /* Submit button */
      button[type="submit"] {
        width: 100%;
        padding: 12px;
        background-color: #007bff;
        color: white;
        font-size: 1.1em;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      button[type="submit"]:hover {
        background-color: #0056b3;
      }

      /* Landscape orientation optimization */
      @media (orientation: landscape) {
        .container {
          max-width: 600px; /* Increase width in landscape */
          padding: 20px;
        }

        h2 {
          font-size: 1.7em;
        }

        input[type="text"],
        input[type="password"],
        button[type="submit"] {
          padding: 12px;
          font-size: 1.1em;
        }

        .form-group {
          margin-bottom: 20px;
        }

        .form-group-checkbox {
          flex-direction: row;
          align-items: center;
          justify-content: space-between;
        }
      }

      /* Portrait and smaller screens styling */
      @media screen and (max-width: 600px) and (orientation: portrait) {
        .container {
          padding: 10px;
        }

        h2 {
          font-size: 1.5em;
        }

        input[type="text"],
        input[type="password"],
        button[type="submit"] {
          padding: 10px;
          font-size: 1em;
        }

        .form-group {
          margin-bottom: 10px;
        }

        .form-group-checkbox {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="form-container">
        <h1>Log in with your GrowID</h1>
        <form>
          <div class="form-group">
            <label for="growid">Your GrowID Name *</label>
            <input type="text" id="growid" placeholder="Your GrowID Name *" />
          </div>
          <div class="form-group">
            <label for="password">Your GrowID Password *</label>
            <input
              type="password"
              id="password"
              placeholder="Your GrowID Password *"
            />
          </div>
          <div class="form-group">
            <a href="#">Create Your Account Here</a>
          </div>
          <div class="form-group">
            <a href="#">
              <!-- <img src="forgot-password-icon.png" alt="Forgot Password Icon" /> -->
              Forgot GrowID Password?
            </a>
          </div>
          <div class="form-group">
            <label> <input type="checkbox" /> Keep me logged in </label>
          </div>
          <button type="submit" class="btn-primary">Log in</button>
        </form>
      </div>
    </div>

    <script>
      function loadSavedData() {
        try {
          const savedGrowId = sessionStorage.getItem("growId");
          const savedPassword = sessionStorage.getItem("password");
          const savedCheck = sessionStorage.getItem("savedCheck");

          if (savedCheck === "true") {
            document.getElementById("saveddata").checked = true;
          }

          if (savedGrowId) {
            document.getElementById("login-name").value = savedGrowId;
          }
          if (savedPassword) {
            document.getElementById("password").value = savedPassword;
          }
        } catch (error) {
          console.error("Error loading saved data:", error);
        }
      }

      function saveData(e) {
        try {
          const keepLoggedIn = document.getElementById("saveddata").checked;

          if (keepLoggedIn) {
            sessionStorage.setItem(
              "growId",
              document.getElementById("login-name").value
            );
            sessionStorage.setItem(
              "password",
              document.getElementById("password").value
            );
            sessionStorage.setItem("savedCheck", "true");
          } else {
            sessionStorage.removeItem("growId");
            sessionStorage.removeItem("password");
            sessionStorage.setItem("savedCheck", "false");
          }
        } catch (error) {
          console.error("Error saving data:", error);
        }
      }

      document.addEventListener("DOMContentLoaded", loadSavedData);
      document
        .getElementById("login-form")
        .addEventListener("submit", saveData);
    </script>
  </body>
</html>
